name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      PR_BASE: ${{ github.base_ref }}
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5

      - name: Validate Conventional Commit title
        run: go run ./scripts/check_pr_title.go

  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5

      - name: Verify compatibility metadata and generated sources
        env:
          BRANCH_TO_VALIDATE: ${{ github.base_ref || github.ref_name }}
        run: go run ./scripts/check_compat.go -branch "$BRANCH_TO_VALIDATE"

      - name: Verify tidy module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  api-compat:
    if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APIDIFF: golang.org/x/exp/cmd/apidiff@v0.0.0-20260611194520-c48552f49976
      MODULE: go.codycody31.dev/gobullmq
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5

      - name: Compare exported module API with PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/gobullmq-base "$BASE_SHA"
          (
            cd /tmp/gobullmq-base
            go run "$APIDIFF" -m -w /tmp/gobullmq-base.api "$MODULE"
          )
          go run "$APIDIFF" -m -w /tmp/gobullmq-head.api "$MODULE"
          go run "$APIDIFF" -m -incompatible /tmp/gobullmq-base.api /tmp/gobullmq-head.api | tee /tmp/gobullmq-apidiff.txt
          if [[ -s /tmp/gobullmq-apidiff.txt ]]; then
            echo "::error::incompatible exported API change on a fixed release line"
            exit 1
          fi

  go-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go:
          - 1.20.x
          - 1.26.5
    services:
      redis:
        image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          REDIS_ADDR: 127.0.0.1:6390
        run: go test -count=1 ./...

  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5

      - name: Race test
        env:
          REDIS_ADDR: 127.0.0.1:6390
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

  interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode:
          - standalone
          - cluster
    env:
      REDIS_MODE: ${{ matrix.mode }}
      REDIS_ADDRS: ${{ matrix.mode == 'cluster' && '127.0.0.1:7000,127.0.0.1:7001,127.0.0.1:7002,127.0.0.1:7003,127.0.0.1:7004,127.0.0.1:7005' || '127.0.0.1:6390' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: integration/node/package-lock.json

      - name: Install Node fixture
        working-directory: integration/node
        run: npm ci --ignore-scripts --no-audit

      - name: Start Redis
        run: scripts/ci/redis-"$REDIS_MODE".sh up

      - name: Run interoperability tests
        run: go test -tags=interop -count=1 -v ./integration/interop

      - name: Print Redis diagnostics
        if: failure()
        run: scripts/ci/redis-"$REDIS_MODE".sh logs

      - name: Stop Redis
        if: always()
        run: scripts/ci/redis-"$REDIS_MODE".sh down

  required:
    name: CI / required
    if: always()
    needs:
      - pr-title
      - metadata
      - api-compat
      - go-test
      - race
      - lint
      - interop
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Require every CI gate
        run: |
          set -euo pipefail
          while read -r result; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::required CI job finished with result: $result"
              exit 1
            fi
          done < <(jq -r '.[].result' <<<"$NEEDS")
